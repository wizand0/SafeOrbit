plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def yandexKey = localProps.getProperty("YANDEX_MAPKIT_API_KEY", "")

android {
    namespace 'ru.wizand.safeorbit'
    compileSdk 36

    defaultConfig {
        applicationId "ru.wizand.safeorbit"
        minSdk 29
        targetSdk 35
        versionCode 22
        versionName "1.8.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "YANDEX_MAPKIT_API_KEY", "\"${yandexKey}\""

        manifestPlaceholders = [
                YANDEX_MAPKIT_API_KEY: yandexKey
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
}

// Фиксированный JDK для компиляции: Gradle сам найдёт/скачает JDK 17,
// сборка не зависит от JAVA_HOME и системного java (в т.ч. JBR 25)
kotlin {
    jvmToolchain(17)
}

dependencies {
    // Core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.recyclerview

    // Firebase
    implementation libs.firebase.database.ktx
    implementation libs.firebase.auth.ktx
    implementation libs.firebase.storage.ktx
    implementation libs.firebase.perf.ktx
    implementation platform(libs.firebase.bom)

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.savedstate

    // Hilt
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.fragment // стабильная
    implementation libs.kotlinx.metadata.jvm // 👈 fix для Kotlin 2.1.x

    // Kotlin Coroutines
    implementation libs.kotlinx.coroutines.android

    // Room
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // WorkManager
    implementation libs.androidx.work.runtime.ktx

    // Navigation
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Location + MapKit
    implementation libs.play.services.location
    implementation libs.mapsMobile

    // QR
    implementation libs.core
    implementation libs.zxing.android.embedded

    // Tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // Security - EncryptedSharedPreferences
    implementation libs.androidx.security.crypto

    // Если используете Tink (опционально, для дополнительной безопасности)
    implementation libs.tink.android
}

ksp {
    arg("room.schemaLocation", "$projectDir/src/main/assets/schemas")
}